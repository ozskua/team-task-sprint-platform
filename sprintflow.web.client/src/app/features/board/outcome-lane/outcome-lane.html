<section class="outcome" aria-labelledby="outcome-heading">
  <h2 class="outcome-heading" id="outcome-heading">Outcome</h2>

  <div
    class="outcome-zone outcome-zone--complete"
    role="group"
    aria-label="Completed"
    cdkDropList
    [id]="dropListId(completed())"
    [cdkDropListData]="completed()"
    [cdkDropListConnectedTo]="connectedTo()"
    (cdkDropListDropped)="taskDropped.emit($event)">
    <span class="outcome-hint" aria-hidden="true">Complete</span>

    @for (task of completed().tasks; track task.taskId) {
      <app-task-card
        cdkDrag
        [cdkDragData]="task"
        [cdkDragDisabled]="isMoving(task.taskId)"
        [task]="task"
        [moving]="isMoving(task.taskId)"
        outcome="Completed"
        (open)="openTask.emit($event)"
        (edit)="editTask.emit($event)"
        (remove)="deleteTask.emit($event)" />
    }
  </div>

  <div
    class="outcome-zone outcome-zone--cancel"
    role="group"
    aria-label="Cancelled"
    cdkDropList
    [id]="dropListId(cancelled())"
    [cdkDropListData]="cancelled()"
    [cdkDropListConnectedTo]="connectedTo()"
    (cdkDropListDropped)="taskDropped.emit($event)">
    <span class="outcome-hint" aria-hidden="true">Cancel</span>

    @for (task of cancelled().tasks; track task.taskId) {
      <app-task-card
        cdkDrag
        [cdkDragData]="task"
        [cdkDragDisabled]="isMoving(task.taskId)"
        [task]="task"
        [moving]="isMoving(task.taskId)"
        outcome="Cancelled"
        (open)="openTask.emit($event)"
        (edit)="editTask.emit($event)"
        (remove)="deleteTask.emit($event)" />
    }
  </div>
</section>
