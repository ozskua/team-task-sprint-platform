<article class="task-card" [class.task-card--moving]="moving()" (click)="onCardClick($event)">
  <span class="task-card-priority" [class]="'task-card-priority--' + task().priority">
    {{ priorityLabel() }}
  </span>

  <button class="task-card-open" type="button" (click)="open.emit(task())">
    <span class="task-card-title">{{ task().title }}</span>
  </button>

  <div class="task-card-footer">
    <button
      class="task-card-menu"
      mat-icon-button
      type="button"
      [disabled]="moving()"
      [attr.aria-label]="'Actions for ' + task().title"
      [matMenuTriggerFor]="cardMenu">
      <mat-icon>more_horiz</mat-icon>
    </button>

    <mat-menu #cardMenu="matMenu">
      <button mat-menu-item type="button" (click)="open.emit(task())">Details</button>
      <button mat-menu-item type="button" (click)="edit.emit(task())">Edit</button>
      <button mat-menu-item type="button" (click)="remove.emit(task())">Delete</button>
    </mat-menu>

    @if (outcome(); as outcome) {
      <span
        class="task-card-outcome"
        [class.task-card-outcome--completed]="outcome === 'Completed'"
        [class.task-card-outcome--cancelled]="outcome === 'Cancelled'"
        role="img"
        [attr.title]="outcome"
        [attr.aria-label]="outcome">
        <mat-icon aria-hidden="true">{{ outcomeIcon() }}</mat-icon>
      </span>
    }

    @if (task().assignee; as assignee) {
      <span
        class="assignee-avatar"
        role="img"
        [attr.title]="assigneeLabel()"
        [attr.aria-label]="assigneeLabel()">
        <span aria-hidden="true">{{ initials(assignee.fullName) }}</span>
      </span>
    } @else {
      <span class="assignee-none" [attr.title]="assigneeLabel()">Unassigned</span>
    }
  </div>
</article>
