<div class="dashboard">

  <section class="dashboard-section">
    <h2 class="section-title">Summary</h2>

    <!-- Row 1 — what needs attention, then current state. -->
    <div class="metric-grid metric-grid--four">
      <app-metric-card
        label="Overdue Tasks"
        tier="primary"
        [value]="metrics().overdueTasks"
        [loading]="loading()"
        link="/admin/tasks"
        [linkParams]="{ overdue: 'true' }" />

      <app-metric-card
        label="Todo"
        [value]="metrics().todoTasks"
        [loading]="loading()"
        link="/admin/tasks"
        [linkParams]="{ status: 'Todo' }" />

      <app-metric-card
        label="In Progress"
        [value]="metrics().inProgressTasks"
        [loading]="loading()"
        link="/admin/tasks"
        [linkParams]="{ status: 'InProgress' }" />

      <app-metric-card
        label="Completed"
        [value]="metrics().completedTasks"
        [loading]="loading()"
        link="/admin/tasks"
        [linkParams]="{ status: 'Completed' }" />
    </div>

    <!-- Row 2 — how large the system is. Context, not action. -->
    <div class="metric-grid metric-grid--three">
      <app-metric-card
        label="Total Users"
        tier="tertiary"
        [value]="metrics().totalUsers"
        [loading]="loading()" />

      <app-metric-card
        label="Total Teams"
        tier="tertiary"
        [value]="metrics().totalTeams"
        [loading]="loading()" />

      <app-metric-card
        label="Total Tasks"
        tier="tertiary"
        [value]="metrics().totalTasks"
        [loading]="loading()"
        link="/admin/tasks" />
    </div>
  </section>

  <section class="dashboard-section">
    <h2 class="section-title">Analytics</h2>

    <div class="panel">
      <h3 class="panel-title">Task flow — created vs completed, last 30 days</h3>
      <app-trend-chart [points]="trend()" [loading]="loading()" />
    </div>
  </section>

  <section class="dashboard-section">
    <h2 class="section-title">Teams</h2>

    <div class="panel panel--flush">
      <app-team-table [rows]="teams()" [loading]="loading()" />
      <div class="panel-footer">
        <a class="panel-link" routerLink="/admin/teams">View all teams</a>
      </div>
    </div>
  </section>

</div>
