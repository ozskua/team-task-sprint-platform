<div class="dashboard">

  <section class="dashboard-section">
    <h2 class="section-title">System Summary</h2>

    <div class="metric-grid metric-grid--four">
      <app-metric-card label="To Do" [value]="counts().toDo" [loading]="loading()" />
      <app-metric-card label="Open" [value]="counts().open" [loading]="loading()" />
      <app-metric-card label="Completed" [value]="counts().completed" [loading]="loading()" />
      <app-metric-card label="Cancelled" [value]="counts().cancelled" [loading]="loading()" />
    </div>

    <div class="metric-grid metric-grid--two">
      <app-metric-card label="Users" tier="tertiary" [value]="counts().totalUsers" [loading]="loading()" />
      <app-metric-card label="Boards" tier="tertiary" [value]="counts().totalBoards" [loading]="loading()" />
    </div>

    <div class="panel summary-progress">
      <div class="summary-progress-head">
        <span class="summary-progress-label">Overall progress</span>
        <span class="summary-progress-percent">{{ progressPercent() }}%</span>
      </div>
      <div
        class="summary-track"
        role="progressbar"
        [attr.aria-valuenow]="progressPercent()"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-label="Overall task progress across the system"><div
          class="summary-fill" [style.width.%]="progressPercent()"></div>
      </div>
    </div>
  </section>

  <section class="dashboard-section">
    <h2 class="section-title">All Tasks</h2>

    <app-all-tasks-table [tasks]="tasks()" [loading]="loading()" [failed]="failed()" />
  </section>

</div>
