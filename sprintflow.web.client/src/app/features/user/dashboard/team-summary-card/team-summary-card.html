<a class="team-card" [routerLink]="['/boards', team().boardId]">
  <span class="team-info">
    <span class="team-name">{{ team().boardName }}</span>
    <span class="team-area">{{ team().areaName }}</span>
    <span class="team-count">{{ assignedTaskLabel() }}</span>
  </span>

  @if (team().members.length > 0) {
    <ul class="member-avatars">
      @for (member of team().members; track member.userId) {
        <li
          class="member-avatar"
          role="img"
          [attr.title]="member.fullName"
          [attr.aria-label]="member.fullName">
          <span aria-hidden="true">{{ initials(member.fullName) }}</span>
        </li>
      }
    </ul>
  }
</a>
