<a class="task-row" [routerLink]="['/boards', task().boardId]">
  <span class="task-row-main">
    <span class="task-row-title">{{ task().title }}</span>
    <span class="task-row-board">{{ task().areaName }} · {{ task().boardName }}</span>
  </span>

  <span class="column-chip" [class]="chipClass()">{{ task().columnName }}</span>
</a>
